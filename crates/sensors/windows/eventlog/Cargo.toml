[package]
name = "sensor-windows-eventlog"
version.workspace = true
description = "Windows Event Log channel telemetry (EvtSubscribe)"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
thiserror = { workspace = true }
tracing = { workspace = true }

# The Event Log API (`EvtQuery`/`EvtNext` polling, `EvtSubscribe`, `EvtRender`,
# the channel `Enabled` check) for the Windows-gated `sensor.rs`, `query.rs`,
# `subscribe.rs` and `channel.rs`; Windows-only so the portable `xml/` and
# `targets/` modules still build and test elsewhere. `Win32_Security` is where
# windows-sys gates `EVT_VARIANT` and `EvtGetChannelConfigProperty`.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_EventLog",
] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }
proptest = "1"
time = "0.3"

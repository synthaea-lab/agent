[package]
name = "sensor-linux-audit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../../../schema" }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
tokio = { version = "1.53.3", features = ["net", "sync", "rt", "signal", "macros", "time"] }

[dev-dependencies]
tempfile = "3"

# Runs without libtest's harness: the death signal is a setting of the main thread, and libtest
# runs each test on a thread of its own.
[[test]]
name = "watchdog_pid"
harness = false

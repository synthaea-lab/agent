[package]
name = "sigma"
version.workspace = true
description = "Sigma rule parsing and compilation for on-device evaluation"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../schema" }
serde = { workspace = true }
serde-saphyr = { version = "2.0", default-features = false, features = ["deserialize"] }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Cross-repo contract fixtures (sibling checkouts of the other public repos), skipped when absent.
siblings = { path = "../siblings" }
schema = { path = "../schema", features = ["test-fixtures"] }
serde_json = { workspace = true }
tempfile = "3"
proptest = "1"

[package]
name = "yara"
version.workspace = true
description = "YARA-X content scanning: budgeted scan queue feeding detections"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
schema = { path = "../schema" }
yara-x = { version = "1", default-features = false }
thiserror = { workspace = true }
store = { path = "../store" }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Cross-repo contract fixtures (sibling checkouts of the other public repos), skipped when absent.
siblings = { path = "../siblings" }

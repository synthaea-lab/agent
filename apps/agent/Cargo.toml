[package]
name = "agent"
version.workspace = true
description = "The Synthaea agent binary — wires sensors, detection, and response together"
license.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Keep one-command development builds convenient. Linux release packaging disables
# the downloaded glibc-built runtime and links a source-built musl runtime instead.
default = ["dynamic-onnx", "test-key"]
dynamic-onnx = ["pipeline/dynamic-onnx"]
# The public test signing key set and the `--allow-test-key` flag that
# acknowledges it. A packaged build turns it off: it then embeds only the production keys.
test-key = ["delivery/test-key", "pipeline/test-key"]

[dependencies]
schema = { path = "../../crates/schema" }
redact = { path = "../../crates/redact" }
config = { path = "../../crates/config" }
policy = { path = "../../crates/policy" }
rules = { path = "../../crates/rules" }
enrich = { path = "../../crates/enrich" }
yara = { path = "../../crates/yara" }
deception = { path = "../../crates/deception" }
sinks = { path = "../../crates/sinks" }
tamper = { path = "../../crates/tamper" }
inventory = { path = "../../crates/inventory" }
delivery = { path = "../../crates/delivery" }
pipeline = { path = "../../crates/pipeline", default-features = false }
health = { path = "../../crates/health" }
workers = { path = "../../crates/workers" }
transport = { path = "../../crates/transport" }

anyhow = "1"
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = { workspace = true }
# fmt + env-filter: RUST_LOG-style filtering; the default "tracing-log" feature
# bridges `log` records (aya-log, dependencies) into the subscriber.
tracing-subscriber = { workspace = true }
getrandom = "0.4"

# `commands::localzone` asks the platform for the host's time zone (https://github.com/synthaea-lab/agent/issues/15): platform code stays
# in the binary, not in the detection crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Time"] }
sensor-windows = { path = "../../crates/sensors/windows/etw" }
sensor-windows-eventlog = { path = "../../crates/sensors/windows/eventlog" }
sensor-windows-minifilter = { path = "../../crates/sensors/windows/minifilter" }
sensor-windows-sockets = { path = "../../crates/sensors/windows/sockets" }
ctrlc = "3"

[target.'cfg(target_os = "macos")'.dependencies]
sensor-macos = { path = "../../crates/sensors/macos/endpoint-security" }
sensor-macos-unifiedlog = { path = "../../crates/sensors/macos/unifiedlog" }
sensor-macos-network-extension = { path = "../../crates/sensors/macos/network-extension" }
sensor-macos-sockets = { path = "../../crates/sensors/macos/sockets" }
ctrlc = "3"

[target.'cfg(target_os = "linux")'.dependencies]
sensor-linux = { path = "../../crates/sensors/linux/userspace" }
sensor-linux-audit = { path = "../../crates/sensors/linux/audit" }
sensor-linux-netlink = { path = "../../crates/sensors/linux/netlink" }
sensor-linux-journal = { path = "../../crates/sensors/linux/journal" }
sensor-linux-logs = { path = "../../crates/sensors/linux/logs" }
sensor-linux-procmem = { path = "../../crates/sensors/linux/procmem" }
# `is_filtered_path`: the canary placement check uses the sensor's own filter, so the two
# cannot drift apart (#81).
sensor-linux-wire = { path = "../../crates/sensors/linux/wire" }
sensor-linux-uprobes = { path = "../../crates/sensors/linux/uprobes" }
# Observation-only file_open hook (issue #91/#313): cmd_run attaches it
# best-effort alongside the primary sensor. Inline blocking (-EPERM on a
# verdict) still needs the verdict model from #131/#133 first.
sensor-linux-lsm = { path = "../../crates/sensors/linux/lsm" }
# Named directly in `commands::linux::attach_lsm_hooks`'s return type (the
# `Ebpf` object that must outlive the hook) — same version sensor-linux-lsm
# itself uses.
aya = { version = "0.16", default-features = false }

[dev-dependencies]
pipeline = { path = "../../crates/pipeline", default-features = false, features = ["test-fixtures"] }
deception = { path = "../../crates/deception", features = ["test-fixtures"] }
tempfile = "3"
schema = { path = "../../crates/schema", features = ["test-fixtures"] }

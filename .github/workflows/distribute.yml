name: Distribute

# Pushes a published release to the package channels. Each channel is switched on by its
# repository variable and is skipped (not failed) while that variable is unset, so this
# workflow is a no-op until someone sets one up (docs/release.md, "Distribution channels"):
#
#   Homebrew tap      vars.HOMEBREW_TAP_REPOSITORY   + the release app (cross-repository push)
#   apt / yum repo    vars.PACKAGE_REPO_REPOSITORY   + the release app + RELEASE_GPG_PRIVATE_KEY
#   winget            vars.WINGET_PACKAGE_IDENTIFIER + secrets.WINGET_TOKEN
#
# Pre-releases (every unsigned alpha among them) are not distributed unless
# vars.DISTRIBUTE_PRERELEASES is 'true'. No Microsoft Store channel.
#
# release.yml calls this after publishing; workflow_dispatch re-runs it for any tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      prerelease:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag, for example v0.0.1"
        required: true
        type: string
      prerelease:
        description: "The release is a pre-release (distributed only if DISTRIBUTE_PRERELEASES is 'true')"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.gate.outputs.go }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - name: Decide whether this release is distributed
        id: gate
        env:
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          DISTRIBUTE_PRERELEASES: ${{ vars.DISTRIBUTE_PRERELEASES }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad tag '$TAG'"; exit 1; }
          go=true
          if [ "$PRERELEASE" = true ] && [ "$DISTRIBUTE_PRERELEASES" != true ]; then
            echo "::notice::$TAG is a pre-release: not distributed (set DISTRIBUTE_PRERELEASES=true to change that)"
            go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  homebrew:
    needs: meta
    if: needs.meta.outputs.go == 'true' && vars.HOMEBREW_TAP_REPOSITORY != '' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      TAP: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
    steps:
      - name: Split the tap repository name
        id: tap
        run: |
          set -euo pipefail
          [[ "$TAP" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::HOMEBREW_TAP_REPOSITORY must be owner/name"; exit 1; }
          echo "owner=${TAP%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TAP#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a release app token for the tap
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.tap.outputs.owner }}
          repositories: ${{ steps.tap.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.HOMEBREW_TAP_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: tap

      # The formula is written whole from the release, not patched, so the tap needs no
      # template. Apple Silicon only: the release has no Intel build.
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="synthaea-agent-${VERSION}-macos-arm64.tar.gz"
          gh release download "$TAG" --repo "$REPO" --pattern "$asset" --dir "$RUNNER_TEMP"
          sha="$(sha256sum "$RUNNER_TEMP/$asset" | cut -d' ' -f1)"
          mkdir -p tap/Formula
          cat > tap/Formula/synthaea-agent.rb <<EOF
          # Generated by ${REPO}/.github/workflows/distribute.yml for ${TAG}. Do not edit by hand.
          class SynthaeaAgent < Formula
            desc "Synthaea EDR agent (standalone executable)"
            homepage "https://github.com/${REPO}"
            url "https://github.com/${REPO}/releases/download/${TAG}/${asset}"
            version "${VERSION}"
            sha256 "${sha}"
            license "Apache-2.0"

            depends_on arch: :arm64
            depends_on :macos

            def install
              bin.install "agent" => "synthaea-agent"
            end

            test do
              system bin/"synthaea-agent", "--help"
            end
          end
          EOF

      - name: Commit and push the formula
        working-directory: tap
        run: |
          set -euo pipefail
          git add Formula/synthaea-agent.rb
          if git diff --cached --quiet; then echo "formula already at $VERSION"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "synthaea-agent $VERSION"
          git push

  # A static apt (and, once the release has an .rpm, yum) repository in a separate
  # repository served as static files (GitHub Pages, for example). Every package ever
  # published stays in its pool; the indexes are regenerated and signed with the release GPG
  # key on each run. Only repository metadata is signed here, never an updater manifest.
  package-repo:
    needs: meta
    if: needs.meta.outputs.go == 'true' && vars.PACKAGE_REPO_REPOSITORY != '' && vars.RELEASE_APP_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    env:
      TAG: ${{ inputs.tag }}
      PACKAGE_REPO: ${{ vars.PACKAGE_REPO_REPOSITORY }}
    steps:
      - name: Split the package repository name
        id: repo
        run: |
          set -euo pipefail
          [[ "$PACKAGE_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::PACKAGE_REPO_REPOSITORY must be owner/name"; exit 1; }
          echo "owner=${PACKAGE_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${PACKAGE_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a release app token for the package repository
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.PACKAGE_REPO_REPOSITORY }}
          token: ${{ steps.app.outputs.token }}
          path: site

      - name: Add the release packages to the pools
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p site/apt/pool/main/s/synthaea-agent site/yum/x86_64
          gh release download "$TAG" --repo "$REPO" --pattern '*.deb' --dir site/apt/pool/main/s/synthaea-agent --clobber
          gh release download "$TAG" --repo "$REPO" --pattern '*.rpm' --dir site/yum/x86_64 --clobber || true
          ls -l site/apt/pool/main/s/synthaea-agent site/yum/x86_64

      - name: Regenerate and sign the repository metadata
        env:
          GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::PACKAGE_REPO_REPOSITORY is set but RELEASE_GPG_PRIVATE_KEY is not: apt and dnf refuse an unsigned repository"
            exit 1
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          sign() { gpg --batch --yes --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE:-}" "$@"; }

          cd site/apt
          mkdir -p dists/stable/main/binary-amd64
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -kf dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=Synthaea \
            -o APT::FTPArchive::Release::Label=Synthaea \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" dists/stable/Release
          sign --clearsign --output dists/stable/InRelease dists/stable/Release
          sign --armor --detach-sign --output dists/stable/Release.gpg dists/stable/Release
          cd ..

          shopt -s nullglob
          rpms=(yum/x86_64/*.rpm)
          if [ "${#rpms[@]}" -gt 0 ]; then
            sudo apt-get install -y --no-install-recommends createrepo-c
            createrepo_c --update yum/x86_64
            sign --armor --detach-sign --output yum/x86_64/repodata/repomd.xml.asc yum/x86_64/repodata/repomd.xml
          fi

          gpg --batch --armor --export > synthaea-archive-key.asc
          rm -rf "$GNUPGHOME"

      - name: Commit and push the repository
        working-directory: site
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then echo "repository already has $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -s -m "synthaea-agent $TAG"
          git push

  # A version PR to microsoft/winget-pkgs with komac, as a portable (bare .exe) package. The
  # first version of the package must already be in winget-pkgs (komac update adds versions
  # to an existing package); WINGET_TOKEN is a classic token with public_repo whose owner
  # has a fork of winget-pkgs.
  winget:
    needs: meta
    if: needs.meta.outputs.go == 'true' && vars.WINGET_PACKAGE_IDENTIFIER != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Install komac
        run: cargo install komac --version 2.17.1 --locked

      - name: Submit the new version
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
          IDENTIFIER: ${{ vars.WINGET_PACKAGE_IDENTIFIER }}
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::WINGET_PACKAGE_IDENTIFIER is set but WINGET_TOKEN is not"
            exit 1
          fi
          url="https://github.com/$REPO/releases/download/$TAG/synthaea-agent-$VERSION-windows-x86_64.exe"
          komac update "$IDENTIFIER" --version "$VERSION" --urls "$url" --submit

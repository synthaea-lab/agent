name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR branch cancels that branch's run still in progress. Each
# main commit gets its own group, so every merge commit gets a complete result:
# with one shared group, GitHub keeps a single pending run and cancels the older
# pending one even with cancel-in-progress off (two runs were lost that way on
# 25/09 when merges landed back to back).
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

# Read-only token for every job: nothing here writes to the repo, and a
# compromised step or dependency then can't push, tag or touch PRs.
permissions:
  contents: read

jobs:
  # Formatting and dependency direction — cheap, one OS.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - name: rustfmt
        # rustfmt.toml sets unstable options (group_imports, imports_granularity);
        # stable rustfmt silently ignores them, so the check must run on nightly.
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          cargo +nightly fmt --all --check
      - name: dependency direction
        run: python3 tools/check-deps.py
      - name: docs links, anchors and capability tracking issues
        run: python3 tools/check-docs.py
      # tools/attack-coverage.py --check needs the `rules` sibling: it runs in the
      # `content` job, which checks it out.
      - name: PowerShell scripts ASCII-only
        run: python3 tools/check-ps1-ascii.py
      - name: shell scripts with a shebang are executable in git
        run: python3 tools/check-exec-bits.py
      # The i686 probes are not built anywhere in CI: their offsets are only checked here.
      - name: eBPF tracepoint offsets follow the syscall record layout
        run: python3 tools/check-ebpf-offsets.py
      - name: packaged build carries no test signing key (ADR-0027)
        run: tools/check-no-test-key.sh
      - name: updater trust set without the test key (production code path)
        # Unit tests always compile under cfg(test), where the test seed exists; the
        # integration test is the only thing that exercises the packaged variant.
        run: cargo test -p updater --no-default-features
      - name: tools tests (PE and Mach-O import checkers)
        run: python3 -m unittest discover -s tools/tests -v
      - name: docs build clean
        run: cargo doc --workspace --exclude sensor-linux-ebpf --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Licenses, RUSTSEC advisories, dependency hygiene (deny.toml).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Escalate just the two lints that catch a stale advisories.ignore entry
          # (#919): one whose RUSTSEC id doesn't exist in the advisory db at all,
          # and one that no longer matches anything in our dependency tree (e.g.
          # yara-x finally raising its wasmtime requirement past the ignored
          # advisories). Scoped narrowly on purpose — `-D warnings` would also
          # fail on the `duplicate`/`license-exception-not-encountered` warnings
          # this repo already runs with deliberately non-blocking.
          command-arguments: -D unknown-advisory -D advisory-not-detected

  # Core rule: every workspace crate compiles and passes tests on all three platforms.
  # Platform-specific code lives only in crates/sensors/* behind cfg, so this job is
  # what enforces it.
  #
  # The cross-repo contract tests (golden fixtures from server/ and ml/, the shipped
  # content in rules/; see crates/siblings) need the sibling repos beside this one,
  # cloned side by side (agent/, server/, ml/, rules/). They skip without them locally; here
  # SYNTHAEA_REQUIRE_SIBLINGS=1 makes a missing sibling a failure, so they cannot
  # pass by not running. Siblings track their main branch: a change on either side
  # of a contract that the other cannot read fails the next run here.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SYNTHAEA_REQUIRE_SIBLINGS: "1"
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/server
          ref: main
          path: server
          persist-credentials: false
          sparse-checkout: |
            app
            tests/fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/ml
          ref: main
          path: ml
          persist-credentials: false
          sparse-checkout: tests/fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/rules
          ref: main
          path: rules
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent -> target
      - name: clippy
        run: cargo clippy --workspace --exclude sensor-linux-ebpf --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace --exclude sensor-linux-ebpf
      # release-tool signs from a PKCS#11 token (ADR-0027): the test needs a software token, and
      # `cargo test` above skips it without one. The script makes a skip fatal.
      - name: release-tool PKCS#11 signing, against SoftHSM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends softhsm2 jq
          tools/test-pkcs11.sh
      # The ipc end-to-end test needs root / an elevated process to pass peer-auth, and
      # skips itself otherwise: `cargo test` hides that message, so the step above
      # reports `ok` on the unprivileged ubuntu/macos runners without ever running the
      # happy path (#483). Build as the runner user (a root-owned target/ would break
      # the cache save), run only the test binary under sudo, and make a skip fatal.
      - name: ipc e2e, privileged (Unix)
        if: runner.os != 'Windows'
        env:
          SYNTHAEA_REQUIRE_PRIVILEGED_TESTS: "1"
        run: |
          exe="$(cargo test -p ipc --test e2e --no-run --message-format=json             | jq -r 'select(.profile.test == true and .target.name == "e2e") | .executable'             | tail -n 1)"
          test -x "$exe"
          sudo -E "$exe"
      # The Windows runner is already elevated: just make a skip fatal.
      - name: ipc e2e, elevated (Windows)
        if: runner.os == 'Windows'
        env:
          SYNTHAEA_REQUIRE_PRIVILEGED_TESTS: "1"
        run: cargo test -p ipc --test e2e

  # The shipped detection content (the `rules` sibling repo) through the real engines:
  # every sigma/yara rule must compile/validate AND fire on its crafted matching
  # sample, every rules/ioc feed line must load (crates/{sigma,yara,intel}/tests/
  # content.rs). The `test` job runs these too, among everything else; this job is the
  # fast, focused signal for a content or engine change.
  content:
    runs-on: ubuntu-latest
    env:
      SYNTHAEA_REQUIRE_SIBLINGS: "1"
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: agent
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/rules
          ref: main
          path: rules
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: agent -> target
      - name: sigma content suite
        run: cargo test -p sigma --test content --test platform
      - name: yara content suite
        run: cargo test -p yara --test content
      # The public-suffix half of the ioc check runs in the server repo's CI (it needs
      # the server's list).
      - name: ioc content suite
        run: cargo test -p intel --test content
      # docs/attack-coverage.md must match what this repo plus the `rules` sibling
      # implement. SYNTHAEA_REQUIRE_SIBLINGS=1 (job env) makes a missing sibling fatal.
      - name: ATT&CK coverage up to date
        run: python3 tools/attack-coverage.py --check

  # Linux with the eBPF probes embedded, the configuration we actually ship.
  # The `test` runner has no bpf-linker, so there build.rs skips the probes: the
  # eBPF crate itself never compiles, and clippy only sees the probe-less variant
  # of sensor-linux (#448: code that was dead only in that variant). This job
  # installs the same toolchain as packaging/toolchain/linux-toolchain.sh (the nightly
  # pinned in packaging/toolchain/ebpf-toolchain.txt + rust-src for aya-build, prebuilt bpf-linker at
  # the same pin) and fails if the
  # probes did not get embedded. No `cargo test` here: loading them needs a
  # privileged kernel, which needs a dedicated test VM.
  linux-ebpf:
    runs-on: ubuntu-latest
    env:
      # Keep both in sync with packaging/toolchain/linux-toolchain.sh. The hash is the
      # x86_64 musl tarball's: a replaced release asset must fail here, not run.
      BPF_LINKER_VERSION: v0.11.1
      BPF_LINKER_SHA256: e058a6aecc9e65fa4c977b298a8e4b738424d7629769fd352eed409fb57e16e8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy
      - name: pinned nightly + rust-src (aya-build compiles the probes with it)
        run: rustup toolchain install "$(tr -d '[:space:]' < packaging/toolchain/ebpf-toolchain.txt)" --profile minimal --component rust-src
      - name: bpf-linker (prebuilt, musl-static, bundled LLVM, SHA-256 pinned)
        run: |
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/bpf-linker.tar.zst" \
            "https://github.com/aya-rs/bpf-linker/releases/download/${BPF_LINKER_VERSION}/bpf-linker-x86_64-unknown-linux-musl.tar.zst"
          echo "${BPF_LINKER_SHA256}  $RUNNER_TEMP/bpf-linker.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/bpf-linker.tar.zst" -C "$RUNNER_TEMP"
          install -m755 "$(find "$RUNNER_TEMP" -type f -name bpf-linker -print -quit)" "$HOME/.cargo/bin/bpf-linker"
          bpf-linker --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Never share a cache with the probe-less `test` job: a restored build
          # script output from there would skip the probes (see the stale-build
          # note in packaging/toolchain/linux-toolchain.sh).
          key: ebpf-embedded
      - name: clippy (embedded probes)
        run: cargo clippy -p sensor-linux -p sensor-linux-uprobes -p agent --all-targets -- -D warnings
      - name: probes are embedded
        run: |
          for crate in sensor-linux sensor-linux-uprobes; do
            obj=$(find target/debug/build -regextype posix-extended \
              -regex ".*/build/${crate}-[0-9a-f]{16}/out/sensor-linux-ebpf" -type f -print -quit)
            if [ -z "$obj" ]; then
              echo "::error::${crate} was built WITHOUT embedded eBPF probes"
              exit 1
            fi
            ls -la "$obj"
          done
      # The loader finds every probe and map by name: a rename or a program moved to another
      # section must fail here, not on a kernel (AS-003).
      - name: probe and map names unchanged
        run: |
          for crate in sensor-linux sensor-linux-uprobes; do
            obj=$(find target/debug/build -regextype posix-extended \
              -regex ".*/build/${crate}-[0-9a-f]{16}/out/sensor-linux-ebpf" -type f -print -quit)
            python3 tools/check-ebpf-symbols.py "$obj" crates/sensors/linux/ebpf/symbols.txt
          done
      # The object is embedded in the binary, so `linux-ebpf-verify` needs nothing else.
      - name: build verify_probes
        run: cargo build -p sensor-linux --example verify_probes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-probes
          path: target/debug/examples/verify_probes
          if-no-files-found: error
          retention-days: 3

  # The verifier differs a lot between kernels, and the agent only logs a warning when a
  # probe is refused, then runs without it. #204 (three `ssl_read_entry_*` programs refused
  # on 5.15 and 6.1, accepted on 6.18) passed every other job. This loads every program on
  # the oldest kernels we support, in a VM, and fails on any refusal (#226).
  linux-ebpf-verify:
    needs: linux-ebpf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Vanilla stable kernels built by little-vm-helper-images with BPF LSM, BTF, uprobes
        # and syscall tracepoints enabled. Dated tags, not `-main`, so a run is reproducible.
        kernel: ["5.15-20261021.083220", "6.1-20261021.083220"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-probes
          path: ${{ runner.temp }}/verify-probes
      - run: chmod +x "$RUNNER_TEMP/verify-probes/verify_probes"
      # `inode_setattr` has fewer hook arguments on 5.15 and 6.1, and the loader treats it
      # as optional (#1044).
      - uses: cilium/little-vm-helper@c8b0bfbae3bdda7bc69fb9cd370e4b74ce84986d # v0.0.33
        with:
          test-name: verify-probes-${{ matrix.kernel }}
          image: complexity-test
          image-version: ${{ matrix.kernel }}
          host-mount: ${{ runner.temp }}/verify-probes
          install-dependencies: "true"
          cmd: |
            uname -r
            /host/verify_probes --allow inode_setattr
